<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New York City → Chicago → Seattle — Alexia en route</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.31.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  body{margin:0;background:#f4f1ea;}
  .bk, .bk *{box-sizing:border-box;}
  a{color:#1a1a18;text-decoration:none;}
  a:hover{color:#8a4b3a;}
  .leaflet-container{background:#e6e2d8;font-family:Archivo,sans-serif;}
  .leaflet-tile-pane{filter:grayscale(1) contrast(1.05);}   /* B&W basemap only — markers & routes stay in colour */
  #screen .leg:hover{color:#1a1a18;}
  .bk{display:none;}

  /* Responsive: collapse the two-column grids on narrow screens */
  @media (max-width:860px){
    .cover-grid{grid-template-columns:1fr !important;}
    .cover-grid > div:last-child{border-left:none !important;border-top:1px solid #1a1a18;min-height:280px !important;}
    .lodging-grid,.day-grid{grid-template-columns:1fr !important;gap:26px !important;}
  }

  @media print{
    @page{margin:0;}
    html,body{background:#fff;}
    .screen{display:none !important;}
    .bk{display:block;font-family:Newsreader,Georgia,serif;color:#1a1a18;}
    .pg{position:relative;overflow:hidden;break-after:page;page-break-after:always;background:#fff;}
    .bk.b5 .pg{width:176mm;height:250mm;padding:17mm 15mm 14mm;font-size:9pt;line-height:1.45;}
    .bk.pp .pg{width:88mm;height:125mm;padding:9mm 8mm 8mm;font-size:6.6pt;line-height:1.38;}
    .bk .lbl{font-family:Archivo,sans-serif;text-transform:uppercase;}
    .bk.pp .hero{height:38mm;}
    .bk.b5 .hero{height:78mm;}
    .bk.pp .mapbox{height:44mm;}
    .bk.b5 .mapbox{height:92mm;}
    .bk.pp .cvimg{height:52mm;}
    .bk.b5 .cvimg{height:108mm;}
    img{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .pg *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>
<div class="screen" id="screen" style="background:#f4f1ea;color:#1a1a18;font-family:Archivo,Helvetica,Arial,sans-serif;"></div>
<div class="bk b5" id="bk"></div>

<script type="module">
import { UI, TRIP, RESTO_SETS, DAYS, DAY_COLORS } from './usa-data.js';

const state = { lang: 'fr', day: 0, fmt: 'b5', imgs: {}, hero: null, map: null, city: 'ny', mapCity: 'ny' };

// Map "city" toggles next to Carte — the trip spans a continent, so jump the map per city.
const CITY_DEFS = [
  { key: 'ny',  label: 'New York', min: -80,  max: -60 },
  { key: 'chi', label: 'Chicago',  min: -100, max: -80 },
  { key: 'sea', label: 'Seattle',  min: -130, max: -100 }
];
function cityCoords(key) {
  const c = CITY_DEFS.find(x => x.key === key);
  if (!c) return [];
  const pts = [];
  const inBand = lng => lng > c.min && lng <= c.max;
  (TRIP.lodging || []).forEach(l => { if (l.lat && l.lng && inBand(l.lng)) pts.push([l.lat, l.lng]); });
  DAYS.forEach(d => d.stops.forEach(s => { if (s.lat && s.lng && inBand(s.lng)) pts.push([s.lat, s.lng]); }));
  RESTO_SETS.forEach(r => r.items.forEach(it => { if (it.lat && it.lng && inBand(it.lng)) pts.push([it.lat, it.lng]); }));
  return pts;
}
function focusCity(key) {
  if (!state.map) return;
  const pts = cityCoords(key);
  if (pts.length) state.map.fitBounds(pts, { padding: [40, 40], maxZoom: 14 });
}
// Which city a day belongs to (median longitude of its mapped stops).
function dayCity(day) {
  const xs = day.stops.filter(s => s.lng).map(s => s.lng).sort((a, b) => a - b);
  if (!xs.length) return '';
  const ml = xs[Math.floor(xs.length / 2)];
  const c = CITY_DEFS.find(x => ml > x.min && ml <= x.max);
  return c ? c.key : '';
}
function hotelCity(l) {
  if (l.lat && l.lng) { const c = CITY_DEFS.find(x => l.lng > x.min && l.lng <= x.max); if (c) return c.key; }
  const t = String((l.title && l.title.fr) || l.title || '').toLowerCase();
  if (/seattle/.test(t)) return 'sea';
  if (/chicago|romeoville|river north|freehand|albert/.test(t)) return 'chi';
  return 'ny';
}
// Match a restaurant set to a day by the "<n> <month>" date token both carry.
const dkey = str => { const m = String(str || '').toLowerCase().match(/(\d{1,2})\s+([a-zà-ÿ]{3,9})/); return m ? (m[1] + '|' + m[2].slice(0, 4)) : null; };
function restoDay(r) { const k = dkey((r.title && r.title.fr) || r.title); if (!k) return -1; return DAYS.findIndex(d => dkey((d.date && d.date.fr) || d.date) === k); }

/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const tr = o => (o && typeof o === 'object' && o[state.lang] !== undefined) ? o[state.lang] : o;
// Colour each day by its city (coherent hue family per city, a lightness step per day within it),
// so the legend and the map routes always share the same colour.
const CITY_HUE = { ny: 212, chi: 20, sea: 150 };
const dayColor = i => {
  const key = dayCity(DAYS[i]);
  const hue = CITY_HUE[key] != null ? CITY_HUE[key] : 265;
  let pos = 0; for (let j = 0; j <= i; j++) if (dayCity(DAYS[j]) === key) pos++;
  return 'hsl(' + hue + ',58%,' + Math.min(30 + (pos - 1) * 7, 60) + '%)';
};
const bg = (src, fill) => (fill ? '' : 'position:absolute;inset:0;') +
  'width:100%;height:100%;background:#e6e2d8' + (src ? ' url("' + src + '") center/cover no-repeat' : '') +
  ';filter:grayscale(1) contrast(1.06);';
const heroStyle = fill => bg(state.hero && state.hero.src ? state.hero.src : '', fill);
const photoStyle = (key, fill) => { const img = state.imgs[key]; return bg(img && img.src ? img.src : '', fill); };
const pill = a => 'font-family:Archivo,sans-serif;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;padding:7px 12px;cursor:pointer;border:1px solid ' +
  (a ? '#1a1a18' : '#cfc9bd') + ';background:' + (a ? '#1a1a18' : 'transparent') + ';color:' + (a ? '#f4f1ea' : '#57534b') + ';';
const tabBtn = a => 'font-family:Archivo,sans-serif;background:none;border:none;border-bottom:2px solid ' +
  (a ? '#8a4b3a' : 'transparent') + ';color:' + (a ? '#1a1a18' : '#7a756c') + ';padding:16px 22px;cursor:pointer;text-transform:uppercase;text-align:left;';
const cityTab = a => 'font-family:Archivo,sans-serif;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;font-weight:600;padding:12px 22px;cursor:pointer;border:1px solid ' +
  (a ? '#1a1a18' : '#cfc9bd') + ';background:' + (a ? '#1a1a18' : 'transparent') + ';color:' + (a ? '#f4f1ea' : '#57534b') + ';';
const HDR = 'font-size:0.66em;letter-spacing:0.2em;border-bottom:1px solid #1a1a18;padding-bottom:0.45em;margin-bottom:1.1em;display:flex;justify-content:space-between;';
const chunk = (arr, n) => { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out.length ? out : [[]]; };
const pp = h => (h && /[£$€]/.test(h)) ? h + ' pp' : (h || '');   // mark prices as per-person
// Category → Tabler icon, matched on the stop's kind (works for FR/EN/ES labels).
function kindIcon(kind) {
  const k = String(kind || '').toLowerCase();
  if (/mus[ée]e|galer|museum|museo/.test(k)) return 'ti-building-bank';
  if (/monument|cath|église|iglesia|landmark|\bsite\b|monumento|palais|palace/.test(k)) return 'ti-building-monument';
  if (/balade|marche|promenade|walk|paseo/.test(k)) return 'ti-walk';
  if (/caf[ée]|petit|breakfast|desayuno|coffee/.test(k)) return 'ti-coffee';
  if (/d[ée]jeuner|d[îi]ner|repas|lunch|dinner|snack|almuerzo|cena|comer/.test(k)) return 'ti-tools-kitchen-2';
  if (/vol|flight|vuelo|a[ée]roport|airport/.test(k)) return 'ti-plane';
  if (/bateau|boat|ferry|barco|croisi|navette/.test(k)) return 'ti-sailboat';
  if (/trajet|transit|m[ée]tro|train|d[ée]part|arriv|salida|llegada|transporte/.test(k)) return 'ti-train';
  if (/soir[ée]e|spectacle|match|blues|jazz|concert|show|night|noche|partido/.test(k)) return 'ti-music';
  if (/insolite|curiosit|passage|belv|viewpoint|vue|mirador/.test(k)) return 'ti-star';
  return 'ti-map-pin';
}
// Day-stop marker: coloured disc (day) + category icon + small order badge.
const stopPin = (color, icon, n) => L.divIcon({ className: '', iconSize: [24, 24], iconAnchor: [12, 12],
  html: '<div style="position:relative;width:24px;height:24px;border-radius:50%;background:' + color + ';border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;">' +
    '<i class="ti ' + icon + '" style="font-size:14px;line-height:1;"></i>' +
    '<span style="position:absolute;top:-6px;right:-6px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:#f4f1ea;color:#1a1a18;border:1px solid #1a1a18;font:600 9px Archivo,sans-serif;display:flex;align-items:center;justify-content:center;box-sizing:border-box;">' + n + '</span>' +
  '</div>' });
// Selected day stays in colour; the other days fade to grey.
const MAP_GREY = '#b7b1a5';
function highlightDay(sel) {
  (state.mapDays || []).forEach((md, di) => {
    const on = (sel == null) || di === sel;
    const col = on ? md.color : MAP_GREY;
    if (md.line) md.line.setStyle({ color: col, opacity: on ? 0.85 : 0.22, weight: on ? 2.5 : 1.5 });
    md.markers.forEach(mk => { mk.marker.setIcon(stopPin(col, mk.icon, mk.n)); mk.marker.setOpacity(on ? 1 : 0.5); mk.marker.setZIndexOffset(on ? 600 : 0); });
  });
}
const AIRPORT_RE = /a[eé]roport|airport|gatwick|heathrow|\bjfk\b|o'?hare|sea[- ]?tac|newark|laguardia|midway|el prat|\bord\b|\bewr\b|\blga\b/i;
const isAirport = s => /^(vol|flight|vuelo)$/i.test(String(tr(s.kind) || '').trim()) || AIRPORT_RE.test(String(tr(s.name) || ''));

/* ---------- static B&W tile map (print) ---------- */
function tileMap(stops, w, h, tz) {
  const lat2y = (lat, z) => (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z) * 256;
  const lng2x = (lng, z) => (lng + 180) / 360 * Math.pow(2, z) * 256;
  let pts = stops.map((s, i) => ({ lat: s.lat, lng: s.lng, n: i + 1 })).filter(s => s.lat);
  if (!pts.length) return { tiles: [], dots: [] };
  const med = arr => arr.slice().sort((a, b) => a - b)[Math.floor(arr.length / 2)];
  const mLat = med(pts.map(p => p.lat)), mLng = med(pts.map(p => p.lng));
  const inner = pts.filter(p => Math.abs(p.lat - mLat) < 0.09 && Math.abs(p.lng - mLng) < 0.16);
  if (inner.length >= 2) pts = inner;
  let z = tz;
  const minLat = Math.min(...pts.map(p => p.lat)), maxLat = Math.max(...pts.map(p => p.lat));
  const minLng = Math.min(...pts.map(p => p.lng)), maxLng = Math.max(...pts.map(p => p.lng));
  while (z > 8) {
    const dx = lng2x(maxLng, z) - lng2x(minLng, z), dy = lat2y(minLat, z) - lat2y(maxLat, z);
    if (dx < w * 0.82 && dy < h * 0.82) break;
    z--;
  }
  const cx = lng2x((minLng + maxLng) / 2, z), cy = lat2y((minLat + maxLat) / 2, z);
  const originX = cx - w / 2, originY = cy - h / 2;
  const tiles = [];
  const tx0 = Math.floor(originX / 256), ty0 = Math.floor(originY / 256);
  const tx1 = Math.floor((originX + w) / 256), ty1 = Math.floor((originY + h) / 256);
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      tiles.push({
        style: 'position:absolute;display:block;width:256px;height:256px;left:' + (tx * 256 - originX) + 'px;top:' + (ty * 256 - originY) + 'px;' +
          'background:url("https://a.basemaps.cartocdn.com/light_all/' + z + '/' + tx + '/' + ty + '@2x.png") center/256px 256px no-repeat;filter:grayscale(1) contrast(1.05);'
      });
    }
  }
  const dots = pts.map(p => ({
    n: p.n,
    style: 'position:absolute;left:' + (lng2x(p.lng, z) - originX) + 'px;top:' + (lat2y(p.lat, z) - originY) + 'px;transform:translate(-50%,-50%);width:15px;height:15px;border-radius:50%;background:#1a1a18;color:#fff;font:600 9px Archivo,sans-serif;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;'
  }));
  return { tiles, dots };
}

/* ---------- derive view model from state ---------- */
function derive() {
  const ui = UI[state.lang];
  const isPP = state.fmt === 'pp';
  const mw = isPP ? 300 : 600, mh = isPP ? 170 : 352;

  // Global ref numbering across all days (stable, shared by screen + booklet).
  let refN = 0; const refOf = new Map();
  DAYS.forEach(day => day.stops.forEach(s => { if (s.note) { refN++; refOf.set(s, String(refN).padStart(2, '0')); } }));

  const parseNote = txt => txt.split('\n').map(line => {
    const mm = line.match(/^([^:]{3,40}?)\s:\s([\s\S]+)$/);
    return mm ? { label: mm[1], body: mm[2] } : { label: '', body: line };
  });
  const notesForDay = day => {
    const out = [];
    day.stops.forEach(s => {
      if (s.note) {
        const ref = refOf.get(s);
        out.push({ ref, id: 'note-' + ref, stopId: 'stop-' + ref, name: tr(s.name), lat: s.lat, lng: s.lng, parts: parseNote(tr(s.note)) });
      }
    });
    return out;
  };

  const days = DAYS.map((day, i) => {
    const m = tileMap(day.stops, mw, mh, 14);
    const stops = day.stops.map((s, j) => ({ i: j + 1, time: s.time, kind: tr(s.kind), name: tr(s.name), desc: tr(s.desc) }));
    const notes = notesForDay(day);
    return {
      num: 'Jour ' + String(i + 1).padStart(2, '0'),
      date: tr(day.date), title: tr(day.title), lede: tr(day.lede), photoCap: tr(day.photoCap), photo: day.photo,
      stops,
      stopPages: chunk(stops, isPP ? 6 : 12).map((g, gi) => ({ cont: gi > 0 ? '(suite)' : '', stops: g })),
      notes,
      culturePages: notes.length ? chunk(notes, isPP ? 2 : 5).map((g, gi) => ({ cont: gi > 0 ? '(suite)' : '', notes: g })) : [],
      tiles: m.tiles, dots: m.dots
    };
  });

  const cur = DAYS[state.day];
  const curStops = cur.stops.map(s => {
    const ref = refOf.get(s) || '';
    return { time: s.time, tag: s.tag || '', kind: tr(s.kind), name: tr(s.name), desc: tr(s.desc), lat: s.lat, lng: s.lng, ref, href: ref ? '#note-' + ref : '' };
  });

  // lodging is an ARRAY (one entry per city/hotel); tag each with its city.
  const hotelsAll = (TRIP.lodging || []).map(l => ({ title: tr(l.title), address: l.address || '', note: tr(l.note) || '', city: hotelCity(l) }));
  const restosAll = RESTO_SETS.map(r => ({ title: tr(r.title), note: tr(r.note), day: restoDay(r), items: r.items.map(it => ({ n: it.n, a: it.a, h: it.h, d: tr(it.d) })) }));
  const cityDayIdx = DAYS.map((d, i) => i).filter(i => dayCity(DAYS[i]) === state.city);

  return {
    ui, isPP,
    trip: { title: tr(TRIP.title), sub: tr(TRIP.sub), dates: tr(TRIP.dates) },
    stats: TRIP.stats.map(s => ({ n: s.n, l: tr(s.l) })),
    lodging: hotelsAll.filter(h => h.city === state.city),   // screen: current city only
    lodgingAll: hotelsAll,                                     // booklet: every hotel
    dayTabs: cityDayIdx.map(i => ({ num: String(i + 1).padStart(2, '0'), date: tr(DAYS[i].date), short: tr(DAYS[i].title), active: i === state.day, val: i })),
    day: { date: tr(cur.date), title: tr(cur.title), lede: tr(cur.lede), options: cur.options ? tr(cur.options) : '', photoCap: tr(cur.photoCap), photo: cur.photo, stops: curStops, notes: notesForDay(cur) },
    days,
    restos: restosAll,                                         // booklet: every set
    dayRestos: restosAll.filter(r => r.day === state.day),     // screen: current day only
    legend: DAYS.map((day, i) => ({ label: tr(day.date), color: dayColor(i), i, city: dayCity(day) })),
    notePages: [1, 2].map(n => ({ n: String(n).padStart(2, '0'), lines: Array.from({ length: isPP ? 15 : 24 }) }))
  };
}

/* ---------- screen fragments ---------- */
function tabsInner(D) {
  return D.dayTabs.map(d => (
    '<button data-act="day" data-val="' + d.val + '" style="' + tabBtn(d.active) + '">' +
      '<span style="display:block;font-size:9px;letter-spacing:0.16em;margin-bottom:4px;">' + d.num + '</span>' +
      '<span style="display:block;font-size:8.5px;letter-spacing:0.04em;text-transform:none;color:#8a4b3a;margin-bottom:4px;white-space:nowrap;">' + esc(d.date) + '</span>' +
      '<span style="display:block;font-family:Newsreader,Georgia,serif;font-style:italic;font-size:15px;letter-spacing:0;text-transform:none;white-space:nowrap;">' + esc(d.short) + '</span>' +
    '</button>'
  )).join('');
}

function panelInner(D) {
  const stopRow = st =>
    '<div ' + (st.ref ? 'id="stop-' + st.ref + '" ' : '') + 'style="display:grid;grid-template-columns:64px minmax(0,1fr);gap:22px;padding:20px 0;border-top:1px solid #e0dad0;scroll-margin-top:120px;">' +
      '<div>' +
        '<div style="font-size:12px;font-weight:600;letter-spacing:0.02em;">' + esc(st.time) + '</div>' +
        (st.tag ? '<div style="font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:#8a4b3a;margin-top:5px;">' + esc(st.tag) + '</div>' : '') +
      '</div>' +
      '<div>' +
        '<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;">' +
          '<h4 style="font-family:Newsreader,Georgia,serif;font-weight:400;font-size:20px;margin:0;">' + esc(st.name) + '</h4>' +
          '<span style="font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#7a756c;">' + esc(st.kind) + '</span>' +
          (st.ref ? '<a href="' + st.href + '" style="font-size:9.5px;letter-spacing:0.1em;color:#8a4b3a;border-bottom:1px solid #d8c9c3;">note ' + st.ref + '</a>' : '') +
          (st.lat && st.lng ? '<span data-act="locate" data-lat="' + st.lat + '" data-lng="' + st.lng + '" style="cursor:pointer;font-size:9.5px;letter-spacing:0.1em;color:#8a4b3a;border-bottom:1px solid #d8c9c3;">carte ↗</span>' : '') +
        '</div>' +
        '<p style="font-size:13px;line-height:1.75;color:#57534b;margin:7px 0 0;max-width:62ch;text-wrap:pretty;">' + esc(st.desc) + '</p>' +
      '</div>' +
    '</div>';

  return (
    '<div>' +
      '<div style="font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#8a4b3a;margin-bottom:12px;">' + esc(D.day.date) + '</div>' +
      '<div style="position:relative;padding-top:118%;background:#e6e2d8;overflow:hidden;">' +
        '<div data-photo="' + esc(D.day.photo) + '" style="' + photoStyle(D.day.photo, false) + '"></div>' +
      '</div>' +
      '<div style="margin-top:9px;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:#7a756c;">' + esc(D.day.photoCap) + '</div>' +
    '</div>' +
    '<div>' +
      '<h2 style="font-family:Newsreader,Georgia,serif;font-weight:300;font-size:clamp(34px,4vw,54px);line-height:1.02;letter-spacing:-0.015em;margin:0 0 16px;">' + esc(D.day.title) + '</h2>' +
      '<p style="font-size:14px;line-height:1.8;color:#57534b;margin:0 0 34px;max-width:52ch;text-wrap:pretty;">' + esc(D.day.lede) + '</p>' +
      (D.day.options ? '<p style="font-size:12px;line-height:1.7;color:#57534b;border-top:1px solid #cfc9bd;border-bottom:1px solid #cfc9bd;padding:12px 0;margin:0 0 34px;">' + esc(D.day.options) + '</p>' : '') +
      D.day.stops.map(stopRow).join('') +
    '</div>'
  );
}

function cultureInner(D) {
  if (!D.day.notes.length) return '';
  return (
    '<div style="padding:70px 0 90px;margin-top:60px;border-top:1px solid #1a1a18;">' +
      '<div style="display:flex;align-items:baseline;gap:16px;margin-bottom:30px;">' +
        '<span style="font-size:10px;letter-spacing:0.22em;text-transform:uppercase;font-weight:600;">' + esc(D.ui.appendix) + '</span>' +
        '<span style="flex:1;height:1px;background:#cfc9bd;"></span>' +
        '<span style="font-family:Newsreader,Georgia,serif;font-style:italic;font-size:15px;color:#7a756c;">' + esc(D.day.date) + '</span>' +
      '</div>' +
      '<div style="columns:2;column-gap:56px;">' +
        D.day.notes.map(n => '<div id="' + n.id + '" style="break-inside:avoid;margin-bottom:20px;scroll-margin-top:120px;">' +
          '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:5px;">' +
            '<a href="#' + n.stopId + '" style="font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8a4b3a;">' + n.ref + ' — ' + esc(n.name) + ' <span style="color:#7a756c;">↩</span></a>' +

          n.parts.map(p => '<p style="font-size:12.5px;line-height:1.7;color:#57534b;margin:0 0 5px;text-wrap:pretty;">' +

function lodgingInner(D) {
  // Multiple hotels stacked under the single "Logement" label.
  return D.lodging.map((l, i) => '<div style="' + (i > 0 ? 'margin-top:22px;padding-top:22px;border-top:1px solid #e0dad0;' : '') + '">' +
    '<h3 style="font-family:Newsreader,Georgia,serif;font-weight:400;font-size:24px;margin:0 0 10px;">' + esc(l.title) + '</h3>' +
    (l.address ? '<p style="margin:0 0 6px;font-size:13px;color:#1a1a18;">' + esc(l.address) + '</p>' : '') +
    (l.note ? '<p style="margin:0;font-size:13px;line-height:1.75;color:#57534b;max-width:56ch;">' + esc(l.note) + '</p>' : '') +
  '</div>').join('');
}

function legendInner(D) {
  // Only the days of the map's selected city (independent of the sub-guide).
  return D.legend.filter(l => l.city === state.mapCity).map(l =>
    '<span data-act="focus" data-val="' + l.i + '" class="leg" style="display:flex;align-items:center;gap:7px;cursor:pointer;"><i style="width:11px;height:11px;border-radius:50%;background:' + l.color + ';display:inline-block;"></i>' + esc(l.label) + '</span>'
  ).join('');
}

function tablesInner(D) {
  // À table — only the restaurant sets for the selected day (hidden when the day has none).
  if (!D.dayRestos.length) return '';
  return (
    '<div style="padding:60px 0 0;border-top:1px solid #1a1a18;margin-top:50px;">' +
      '<div style="display:flex;align-items:baseline;gap:16px;margin-bottom:34px;">' +

        '<span style="flex:1;height:1px;background:#cfc9bd;"></span>' +

      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:44px;">' +
        D.dayRestos.map(r => '<div>' +
          '<h3 style="font-family:Newsreader,Georgia,serif;font-weight:400;font-size:22px;margin:0 0 4px;">' + esc(r.title) + '</h3>' +
          (r.note ? '<div style="font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:#7a756c;margin-bottom:16px;">' + esc(r.note) + '</div>' : '<div style="margin-bottom:12px;"></div>') +
          r.items.map(it => '<div style="padding:11px 0;border-top:1px solid #e0dad0;">' +
            '<div style="display:flex;justify-content:space-between;gap:14px;align-items:baseline;">' +
              '<span style="font-size:13px;font-weight:600;">' + esc(it.n) + '</span>' +

            '<div style="font-size:12.5px;color:#57534b;line-height:1.6;margin-top:3px;">' + esc(it.d) + '</div>' +

  );
}

/* ---------- booklet ---------- */
function renderBooklet() {
  const D = derive();
  const bk = document.getElementById('bk');
  bk.className = 'bk ' + state.fmt;

  let html = '';

  /* cover */
  html +=
    '<div class="pg" style="display:flex;flex-direction:column;justify-content:space-between;text-align:center;">' +
      '<div><div class="lbl" style="font-size:0.72em;letter-spacing:0.3em;">Alexia en route</div>' +
        '<div style="height:1px;background:#1a1a18;margin:0.9em 0 0;"></div></div>' +
      '<div>' +
        '<div class="cvimg" style="background:#e6e2d8;overflow:hidden;margin-bottom:2em;"><div data-hero style="' + heroStyle(true) + '"></div></div>' +
        '<h1 style="font-weight:300;font-size:3.2em;line-height:1;margin:0 0 0.5em;letter-spacing:-0.02em;">' + esc(D.trip.title) + '</h1>' +
        '<div class="lbl" style="font-size:0.78em;letter-spacing:0.22em;color:#57534b;">' + esc(D.trip.dates) + '</div>' +
      '</div>' +
      '<div class="lbl" style="font-size:0.7em;letter-spacing:0.18em;color:#7a756c;">' + esc(TRIP.travellers || '') + '</div>' +
    '</div>';

  /* logement — hotels, then a chunked itinerary summary (paginates for long trips) */
  const hotelsHtml = D.lodgingAll.map(l => '<div style="margin-bottom:1.1em;break-inside:avoid;">' +
    '<h2 style="font-weight:400;font-size:1.4em;margin:0 0 0.2em;">' + esc(l.title) + '</h2>' +
    (l.address ? '<p style="margin:0 0 0.2em;">' + esc(l.address) + '</p>' : '') +
    (l.note ? '<p style="margin:0;color:#57534b;">' + esc(l.note) + '</p>' : '') +
  '</div>').join('');
  const itinRow = d => '<div style="display:flex;justify-content:space-between;gap:1em;padding:0.5em 0;border-bottom:1px solid #e0dad0;">' +
    '<span style="font-style:italic;">' + esc(d.title) + '</span>' +
    '<span class="lbl" style="font-size:0.7em;letter-spacing:0.1em;color:#7a756c;white-space:nowrap;">' + esc(d.date) + '</span>' +
  '</div>';
  const itinRows = D.days.map(itinRow);
  const firstCount = state.fmt === 'pp' ? 4 : 10;
  const contCount = state.fmt === 'pp' ? 15 : 26;
  const firstRows = itinRows.slice(0, firstCount);
  const contChunks = chunk(itinRows.slice(firstCount), contCount).filter(c => c.length);
  html +=
    '<div class="pg">' +
      '<div class="lbl" style="font-size:0.72em;letter-spacing:0.24em;border-bottom:1px solid #1a1a18;padding-bottom:0.5em;margin-bottom:1.6em;">' + esc(D.ui.lodging) + '</div>' +
      hotelsHtml +
      '<div class="lbl" style="font-size:0.68em;letter-spacing:0.2em;border-top:1px solid #cfc9bd;padding-top:0.9em;margin-bottom:1em;">' + esc(D.ui.itinerary) + '</div>' +
      firstRows.join('') +
    '</div>';
  contChunks.forEach(rows => {
    html +=
      '<div class="pg">' +
        '<div class="lbl" style="' + HDR + '"><span>' + esc(D.ui.itinerary) + ' (suite)</span><span></span></div>' +
        rows.join('') +
      '</div>';
  });

  /* per day: title page + itinerary pages + this day's Point Culture */
  D.days.forEach(d => {
    html +=
      '<div class="pg" style="display:flex;flex-direction:column;">' +
        '<div class="lbl" style="font-size:0.7em;letter-spacing:0.22em;color:#8a4b3a;">' + d.num + ' — ' + esc(d.date) + '</div>' +
        '<h2 style="font-weight:300;font-size:2.2em;line-height:1.02;margin:0.4em 0 0.4em;letter-spacing:-0.015em;">' + esc(d.title) + '</h2>' +
        '<p style="margin:0 0 1.2em;color:#57534b;">' + esc(d.lede) + '</p>' +
        '<div class="hero" style="background:#e6e2d8;overflow:hidden;"><div data-photo="' + esc(d.photo) + '" style="' + photoStyle(d.photo, true) + '"></div></div>' +
        '<div class="lbl" style="font-size:0.62em;letter-spacing:0.14em;color:#7a756c;margin-top:0.5em;">' + esc(d.photoCap) + '</div>' +
      '</div>';
    d.stopPages.forEach(sp => {
      html +=
        '<div class="pg">' +
          '<div class="lbl" style="' + HDR + '"><span>' + d.num + ' ' + sp.cont + '</span><span>' + esc(d.date) + '</span></div>' +
          sp.stops.map(st => '<div style="display:flex;gap:0.9em;padding:0.5em 0;border-bottom:1px solid #efece4;break-inside:avoid;">' +
            '<div class="lbl" style="flex:0 0 4.2em;font-size:0.78em;font-weight:600;padding-top:0.15em;">' + esc(st.time) + '</div>' +
            '<div style="flex:1;">' +
              '<div style="font-weight:500;">' + esc(st.name) + '<span class="lbl" style="font-size:0.62em;letter-spacing:0.12em;color:#7a756c;margin-left:0.6em;">' + esc(st.kind) + '</span></div>' +
              '<div style="color:#57534b;">' + esc(st.desc) + '</div>' +
            '</div>' +
          '</div>').join('') +
        '</div>';
    });
    d.culturePages.forEach(cp => {
      html +=
        '<div class="pg">' +
          '<div class="lbl" style="' + HDR + '"><span>' + esc(D.ui.appendix) + ' ' + cp.cont + '</span><span>' + esc(d.date) + '</span></div>' +
          cp.notes.map(n => '<div style="break-inside:avoid;margin-bottom:0.9em;">' +
            '<div class="lbl" style="font-size:0.66em;letter-spacing:0.14em;color:#8a4b3a;">' + n.ref + ' — ' + esc(n.name) + '</div>' +
            n.parts.map(p => '<div style="color:#57534b;margin-top:0.2em;">' +
              (p.label ? '<span class="lbl" style="font-size:0.66em;letter-spacing:0.12em;color:#1a1a18;margin-right:0.45em;">' + esc(p.label) + '</span>' : '') +
              esc(p.body) + '</div>').join('') +
          '</div>').join('') +
        '</div>';
    });
  });

  /* À table */
  D.restos.forEach(r => {
    html +=
      '<div class="pg">' +
        '<div class="lbl" style="font-size:0.66em;letter-spacing:0.2em;border-bottom:1px solid #1a1a18;padding-bottom:0.45em;margin-bottom:1.1em;">' + esc(D.ui.tables) + '</div>' +
        '<h2 style="font-weight:400;font-size:1.7em;margin:0 0 0.25em;">' + esc(r.title) + '</h2>' +
        '<div class="lbl" style="font-size:0.66em;letter-spacing:0.16em;color:#7a756c;margin-bottom:1.4em;">' + esc(r.note) + '</div>' +
        r.items.map(it => '<div style="padding:0.6em 0;border-top:1px solid #e0dad0;break-inside:avoid;">' +
          '<div style="display:flex;justify-content:space-between;gap:1em;"><span style="font-weight:500;">' + esc(it.n) + '</span>' +
          '<span class="lbl" style="font-size:0.7em;color:#7a756c;white-space:nowrap;">' + esc(pp(it.h)) + '</span></div>' +
          '<div style="color:#7a756c;font-size:0.86em;">' + esc(it.a) + '</div>' +
          '<div style="color:#57534b;">' + esc(it.d) + '</div>' +
        '</div>').join('') +
      '</div>';
  });

  /* Carte — one page per day */
  D.days.forEach(d => {
    html +=
      '<div class="pg">' +
        '<div class="lbl" style="' + HDR + '"><span>' + esc(D.ui.map) + '</span><span>' + d.num + '</span></div>' +
        '<div class="mapbox" style="position:relative;overflow:hidden;border:1px solid #1a1a18;background:#eceae4;">' +
          d.tiles.map(t => '<span style="' + t.style + '"></span>').join('') +
          d.dots.map(p => '<span style="' + p.style + '">' + p.n + '</span>').join('') +
        '</div>' +
        '<div style="margin-top:0.9em;columns:2;column-gap:1.4em;">' +
          d.stops.map(st => '<div style="font-size:0.82em;color:#57534b;break-inside:avoid;padding:0.1em 0;">' + st.i + '. ' + esc(st.name) + '</div>').join('') +
        '</div>' +
      '</div>';
  });

  /* Notes & repères — blank ruled pages */
  D.notePages.forEach(np => {
    html +=
      '<div class="pg">' +
        '<div class="lbl" style="font-size:0.66em;letter-spacing:0.2em;border-bottom:1px solid #1a1a18;padding-bottom:0.45em;margin-bottom:1.4em;display:flex;justify-content:space-between;"><span>' + esc(D.ui.notes) + '</span><span>' + np.n + '</span></div>' +
        np.lines.map(() => '<div style="border-bottom:1px solid #e6e2d8;height:2.1em;"></div>').join('') +
      '</div>';
  });

  bk.innerHTML = html;
  applyImages();
}

/* ---------- Leaflet map (screen) ---------- */
function initMap() {
  if (!window.L) { setTimeout(initMap, 200); return; }
  const el = document.getElementById('map');
  if (!el) return;
  if (state.map) { try { state.map.remove(); } catch (e) {} state.map = null; }
  const map = L.map(el);
  state.map = map;
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { subdomains: 'abcd', attribution: '&copy; OpenStreetMap · &copy; CARTO' }).addTo(map);
  const pin = (color, glyph) => L.divIcon({ className: '', iconSize: [18, 18], iconAnchor: [9, 9],
    html: '<div style="background:' + color + ';color:#fff;width:18px;height:18px;border-radius:50%;border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;font:600 9px Archivo,sans-serif;">' + glyph + '</div>' });
  const coords = [];
  // Lodging: a bold, distinct house marker kept on top of the day pins.
  const homeIcon = L.divIcon({ className: '', iconSize: [24, 24], iconAnchor: [12, 12],
    html: '<svg width="24" height="24" viewBox="0 0 24 24" style="filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 1px 1.5px rgba(0,0,0,.35));"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z" fill="#1a1a18"/></svg>' });
  (TRIP.lodging || []).forEach(l => {
    if (l.lat && l.lng) { L.marker([l.lat, l.lng], { icon: homeIcon, zIndexOffset: 1000 }).addTo(map).bindPopup(l.address || tr(l.title)); coords.push([l.lat, l.lng]); }
  });
  state.mapDays = [];
  DAYS.forEach((d, di) => {
    const line = []; const markers = [];
    const dc = dayCity(d);   // only connect stops within the day's own city (no transcontinental lines)
    d.stops.forEach((s, i) => {
      if (!(s.lat && s.lng) || isAirport(s)) return;   // no airport marker
      const ic = kindIcon(tr(s.kind));
      const mk = L.marker([s.lat, s.lng], { icon: stopPin(dayColor(di), ic, i + 1) }).addTo(map).bindPopup(s.time + ' · ' + tr(s.name));
      markers.push({ marker: mk, n: i + 1, icon: ic });
      coords.push([s.lat, s.lng]);
      const band = CITY_DEFS.find(x => s.lng > x.min && s.lng <= x.max);
      if (band && band.key === dc) line.push([s.lat, s.lng]);
    });
    const ln = line.length > 1 ? L.polyline(line, { color: dayColor(di), weight: 2, opacity: 0.75, dashArray: '4 5' }).addTo(map) : null;
    state.mapDays.push({ color: dayColor(di), line: ln, markers });
  });
  // Restaurant markers (rust diamonds) — RESTO items that carry coordinates.
  const restoPin = L.divIcon({ className: '', iconSize: [8, 8], iconAnchor: [4, 4], html: '<div style="width:6px;height:6px;background:#8a4b3a;border:1px solid #fff;transform:rotate(45deg);"></div>' });
  RESTO_SETS.forEach(r => r.items.forEach(it => {
    if (it.lat && it.lng) { L.marker([it.lat, it.lng], { icon: restoPin }).addTo(map).bindPopup((it.n || '') + (it.a ? ' · ' + it.a : '')); }
  }));
  const cityPts = cityCoords(state.mapCity);
  if (TRIP.center && TRIP.center.length >= 2) map.setView([TRIP.center[0], TRIP.center[1]], TRIP.center[2] || 12);
  else if (cityPts.length) map.fitBounds(cityPts, { padding: [40, 40], maxZoom: 14 });
  else if (coords.length) map.fitBounds(coords, { padding: [30, 30] });
  else map.setView([40.7, -74], 4);
  highlightDay(state.day);
}

/* ---------- photography (placeholders from Wikimedia) ---------- */
async function wiki(title, w) {
  try {
    const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + title);
    const j = await r.json();
    const thumb = (j.thumbnail && j.thumbnail.source) || (j.originalimage && j.originalimage.source) || '';
    if (!thumb) return null;
    const file = decodeURIComponent(thumb.split('?')[0].split('/').filter(Boolean).pop().replace(/^\d+px-/, ''));
    return { src: 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(file) + '?width=' + (w || 800), fallback: thumb };
  } catch (e) { return null; }
}
function setFill(el, img) {
  const probe = new Image();
  const paint = url => { el.style.background = '#e6e2d8 url("' + url + '") center/cover no-repeat'; el.style.filter = 'grayscale(1) contrast(1.06)'; };
  probe.onload = () => paint(img.src);
  probe.onerror = () => { if (img.fallback) paint(img.fallback); };
  probe.src = img.src;
}
function applyImages() {
  if (state.hero && state.hero.src) document.querySelectorAll('[data-hero]').forEach(el => setFill(el, state.hero));
  document.querySelectorAll('[data-photo]').forEach(el => {
    const img = state.imgs[el.getAttribute('data-photo')];
    if (img && img.src) setFill(el, img);
  });
}
async function loadImages() {
  state.hero = await wiki(TRIP.hero || 'Manhattan', 1200);
  applyImages();
  for (const d of DAYS) {
    if (!d.photo || state.imgs[d.photo]) continue;
    const img = await wiki(d.photo);
    if (img) { state.imgs[d.photo] = img; applyImages(); }
  }
}

/* ---------- print ---------- */
function doPrint() {
  const size = state.fmt === 'pp' ? '88mm 125mm' : '176mm 250mm';
  let s = document.getElementById('bk-page-size');
  if (!s) { s = document.createElement('style'); s.id = 'bk-page-size'; document.head.appendChild(s); }
  s.textContent = '@media print{@page{size:' + size + ';margin:0;}}';
  window.print();
}

/* ---------- events ---------- */
document.getElementById('screen').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, val = b.dataset.val;
  if (act === 'lang') {
    if (state.lang === val) return;
    state.lang = val;
    document.documentElement.lang = val;
    renderScreen();
    renderBooklet();
  } else if (act === 'fmt') {
    if (state.fmt === val) return;
    state.fmt = val;
    renderScreen();
    renderBooklet();
  } else if (act === 'day') {
    const n = +val;
    if (state.day === n) return;
    state.day = n;
    renderDayRegion();
  } else if (act === 'focus') {
    // Legend click: select that day (panel + colour highlight, greys the rest) and zoom to it.
    const di = +val;
    state.day = di;
    const c = dayCity(DAYS[di]);
    if (c && c !== state.city) { state.city = c; state.mapCity = c; renderScreen(); }
    else renderDayRegion();
    const pts = DAYS[di].stops.filter(s => s.lat && s.lng && !isAirport(s)).map(s => [s.lat, s.lng]);
    if (state.map && pts.length) {
      if (pts.length === 1) state.map.setView(pts[0], 15);
      else state.map.fitBounds(pts, { padding: [40, 40], maxZoom: 15 });
      document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  } else if (act === 'city') {
    // Sub-guide selector: scope the whole screen to NY / Chicago / Seattle.
    if (state.city === val) return;
    state.city = val;
    state.mapCity = val;   // the map follows when you switch sub-guide
    const first = DAYS.findIndex(d => dayCity(d) === val);
    if (first >= 0) state.day = first;
    renderScreen();
  } else if (act === 'mapcity') {
    // Map city button: focus that city AND restore every itinerary to full colour.
    state.mapCity = val;
    document.querySelectorAll('[data-act="mapcity"]').forEach(btn => { btn.style.cssText = pill(btn.dataset.val === val); });
    document.getElementById('map-legend').innerHTML = legendInner(derive());
    focusCity(val);
    highlightDay(null);
    document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
  } else if (act === 'locate') {
    // "carte ↗" on a Point Culture note: pinpoint that stop on the map.
    const lat = +b.dataset.lat, lng = +b.dataset.lng;
    if (state.map && lat && lng) {
      state.map.setView([lat, lng], 16);
      document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  } else if (act === 'print') {
    doPrint();
  }
});

/* ---------- boot ---------- */
(function () {
  // Deep-link from the home page: ?city=ny|chi|sea opens the matching sub-guide directly.
  const c0 = new URLSearchParams(location.search).get('city');
  if (c0 && CITY_DEFS.some(x => x.key === c0)) {
    state.city = c0; state.mapCity = c0;
    const f = DAYS.findIndex(d => dayCity(d) === c0);
    if (f >= 0) state.day = f;
  }
})();
renderScreen();
renderBooklet();
loadImages();
</script>
